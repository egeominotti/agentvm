name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch a VM on …
        2. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from the server output and from ~/AgentVMs/jobs/<id>/ (job.log, console.log, vm.events). Remove anything secret.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: macOS, Mac model, agentvm commit, Claude Code version in the VM image.
    validations:
      required: true
