# Everything that runs without a VM: GitHub's macOS runners cannot nest Virtualization.framework,
# so tests marked #[ignore] (real VMs, Claude, S3) run locally with `cargo test -- --ignored`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The server embeds the dashboard's build, so it is built before the Rust tests.
      - name: Dashboard (types, build, lint, tests)
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run lint
          bun run test
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # `cargo test` writes the dashboard's API types from the Rust ones: they must be committed.
      - name: Dashboard API types match the server
        working-directory: .
        run: |
          changed=$(git status --porcelain web/src/api/generated)
          [ -z "$changed" ] || { echo "regenerate and commit the API types (cargo test):"; echo "$changed"; exit 1; }
      - name: Build the VM helper (Swift)
        working-directory: .
        run: swiftc -O vm-helper/*.swift -o /tmp/agentvm-vm
      - name: Check shell scripts
        working-directory: .
        run: |
          for f in guest/agentvm-job guest/agentvm-claude guest/agentvm-statusline guest/setup-golden.sh guest/agentvm-save scripts/*.sh quickstart; do bash -n "$f"; done
          python3 -c "import ast; [ast.parse(open(f).read()) for f in ['guest/agentvm-pty', 'guest/agentvm-metrics']]"
