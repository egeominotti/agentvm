# Everything that runs without a VM: GitHub's macOS runners cannot nest Virtualization.framework,
# so tests marked #[ignore] (real VMs, Claude, S3) run locally with `cargo test -- --ignored`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The server embeds the dashboard's build, so it is built before the Rust tests.
      - name: Dashboard (types, build, lint, tests)
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run lint
          bun run test
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: |
          cargo test -- --skip process::a_quick_command_returns_at_once
          cargo test --test adapters process::a_quick_command_returns_at_once -- --exact --test-threads=1
      # `cargo test` writes the dashboard's API types from the Rust ones: they must be committed.
      - name: Dashboard API types match the server
        working-directory: .
        run: |
          changed=$(git status --porcelain web/src/api/generated)
          [ -z "$changed" ] || { echo "regenerate and commit the API types (cargo test):"; echo "$changed"; exit 1; }
      - name: Build the VM helper (Swift)
        working-directory: .
        run: swiftc -O -target arm64-apple-macos14 vm-helper/*.swift -o /tmp/agentvm-vm
      - name: Native app and Ghostty preview tests
        working-directory: .
        run: macos/test.sh
      - name: Native application package checks
        working-directory: .
        run: macos/build.sh
      - name: Guest runtime tests
        working-directory: .
        run: python3 -m unittest discover -s guest/tests
      - name: Check shell scripts
        working-directory: .
        run: |
          for f in guest/agentvm-boot guest/agentvm-job guest/agentvm-claude guest/agentvm-statusline guest/agentvm-install guest/agentvm-save guest/agentvm-tailscale guest/setup-golden.sh scripts/*.sh macos/*.sh quickstart; do bash -n "$f"; done
          python3 - <<'PY'
          import ast
          from pathlib import Path
          files = list(Path("guest").rglob("*.py"))
          files += [Path("guest") / name for name in ["agentvm-pty", "agentvm-metrics", "agentvm-run", "agentvm-relay"]]
          for path in files:
              ast.parse(path.read_text(), filename=str(path))
          PY
