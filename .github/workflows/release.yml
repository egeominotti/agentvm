# Tagging vX.Y.Z publishes the native app and a prebuilt CLI distribution for Apple Silicon.
# Both include everything needed to build the VM image on the user's Mac.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Check release version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag does not match the engine version" >&2; exit 1; }
          native=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Info.plist)
          [ "$native" = "$version" ] || { echo "native app and engine versions differ" >&2; exit 1; }
      - name: Build and validate the native app and bundled engine
        run: macos/build.sh
      - name: Package
        run: |
          name="agentvm-${GITHUB_REF_NAME}-macos-arm64"
          mkdir -p "dist/$name/bin" "dist/$name/scripts" "dist/$name/macos" "dist/$name/server/src/mcp"
          cp bin/agentvm-server bin/agentvm-vm bin/agentvm-mcp "dist/$name/bin/"
          cp scripts/build-golden.sh "dist/$name/scripts/"
          cp quickstart README.md CHANGELOG.md SECURITY.md LICENSE AGENTS.md CONTRIBUTING.md "dist/$name/"
          cp macos/OPERATIONS.md "dist/$name/macos/"
          cp server/src/mcp/reference.txt "dist/$name/server/src/mcp/"
          cp -R docs "dist/$name/"
          tar -cf - --exclude='__pycache__' --exclude='*.pyc' --exclude='guest/tests' guest | tar -xf - -C "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cp macos/dist/agentvm-Native-Apple-Silicon.zip "dist/agentvm-native-${GITHUB_REF_NAME}-macos-arm64.zip"
          (cd dist && shasum -a 256 ./*.tar.gz ./*.zip > SHA256SUMS)
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          version = re.escape(tag.removeprefix("v"))
          changelog = Path("CHANGELOG.md").read_text()
          section = re.search(rf"^## \[{version}\][^\n]*\n(.*?)(?=^## |\Z)", changelog, re.M | re.S)
          if not section:
              raise SystemExit(f"CHANGELOG.md has no published section for {tag}")
          notes = section.group(1).strip()
          notes += "\n\n### Downloads\n"
          notes += f"- Native app: `agentvm-native-{tag}-macos-arm64.zip`.\n"
          notes += f"- Prebuilt CLI and MCP server: `agentvm-{tag}-macos-arm64.tar.gz`. Extract it and run `./quickstart`.\n"
          notes += "- `SHA256SUMS` verifies both archives with `shasum -a 256 -c SHA256SUMS`.\n"
          notes += "\nThe VM image is prepared locally on first launch. See README.md for requirements and setup.\n"
          Path("dist/release-notes.md").write_text(notes)
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "agentvm $GITHUB_REF_NAME" --notes-file dist/release-notes.md
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
              --verify-tag --title "agentvm $GITHUB_REF_NAME" --notes-file dist/release-notes.md
          fi
