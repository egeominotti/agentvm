# Dashboard terminals: no status bar, mouse scrolling, full colors.
set -g status off
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# "largest": no size bouncing between multiple tabs attached to the same session.
set -g window-size largest
set -g focus-events on
