# Dashboard terminals: no status bar, mouse scrolling, full colors.
set -g status off
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# "largest": no size bouncing between multiple tabs attached to the same session.
set -g window-size largest
set -g focus-events on
# Copy: drag to select; on release tmux sends the text to the dashboard (OSC 52), which puts it
# on the Mac's clipboard. Paste with Cmd+V.
set -s set-clipboard on
set -as terminal-features ",xterm-256color:clipboard"
# No tmux pop-up menus on right click: they only get in the way in a browser.
unbind -n MouseDown3Pane
unbind -n M-MouseDown3Pane
unbind -n MouseDown3Status
unbind -n MouseDown3StatusLeft
