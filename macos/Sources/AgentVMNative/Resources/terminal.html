<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Terminal</title>
  <script>
    const theme = new URLSearchParams(location.search).get('theme');
    document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
      ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  </script>
  <link rel="stylesheet" href="dist/terminal.css">
  <style>
    @font-face{font-family:'JetBrains Mono NF';src:url('fonts/JetBrainsMonoNerdFontMono-Regular.ttf');font-weight:400}
    @font-face{font-family:'JetBrains Mono NF';src:url('fonts/JetBrainsMonoNerdFontMono-Bold.ttf');font-weight:700}
    html[data-theme=light]{--terminal-background:#eff1f5;color-scheme:light}
    html[data-theme=dark]{--terminal-background:#1e1e2e;color-scheme:dark}
    html,body,#terminal{margin:0;width:100%;height:100%;overflow:hidden;background:var(--terminal-background)}
    body{padding:8px;box-sizing:border-box}
    #terminal{position:relative}
    .term-host{position:absolute;inset:0}
    .xterm{height:100%}
  </style>
</head>
<body><div id="terminal"></div><script type="module" src="dist/terminal.js"></script></body>
</html>
