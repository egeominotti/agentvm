[package]
name = "agentvm"
version = "0.1.0"
edition = "2024"
description = "Run Claude Code agents in parallel, each in its own disposable Linux VM on Apple Silicon"
repository = "https://github.com/egeominotti/agentvm"
readme = "../README.md"
keywords = ["claude", "ai-agents", "virtualization", "apple-silicon", "sandbox"]
categories = ["command-line-utilities", "virtualization", "development-tools"]
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "agentvm-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
