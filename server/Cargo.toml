[package]
name = "agentvm"
version = "0.2.0"
edition = "2024"
description = "Run coding CLIs in disposable Linux VMs on Apple Silicon, with native MCP control"
license = "MIT"
repository = "https://github.com/egeominotti/agentvm"
readme = "../README.md"
keywords = ["claude", "ai-agents", "virtualization", "apple-silicon", "sandbox"]
categories = ["command-line-utilities", "virtualization", "development-tools"]
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "agentvm-server"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.5.1", features = ["transport-io", "schemars"] }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
blake3 = "1"
base64 = "0.22"
sha2 = "0.10"
futures = "0.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
zstd = "0.13"

[dev-dependencies]
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "agentvm-mcp"
path = "src/bin/agentvm-mcp.rs"
