<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentvm</title>
<style>
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --sunken: #f5f7f9;
  --ink: #17202a;
  --ink-2: #4a5663;
  --ink-3: #7b8794;
  --line: #dfe4e9;
  --line-2: #c9d1d9;
  --focus: #2b6fd6;
  --c-queued: #8a96a3;
  --c-active: #2b7de0;
  --c-done: #1f8a5b;
  --c-failed: #cf4339;
  --c-stopped: #8b67c2;
  --feed: #fbfcfd;
  --code-bg: #f1f4f7;
  --add: #1f8a5b;
  --del: #cf4339;
  --add-bg: rgba(31, 138, 91, .09);
  --del-bg: rgba(207, 67, 57, .08);
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --r: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101418; --panel: #171c22; --sunken: #13181d; --ink: #e6eaee; --ink-2: #aab4be; --ink-3: #7a8692;
    --line: #262e37; --line-2: #34404b; --focus: #5c9cf0; --c-queued: #6f7c89; --c-active: #4c96ec;
    --c-done: #3db27a; --c-failed: #ec6b61; --c-stopped: #a78ad6; --feed: #13181d; --code-bg: #1c232a;
    --add: #4cc28a; --del: #f07c73; --add-bg: rgba(76, 194, 138, .1); --del-bg: rgba(240, 124, 115, .1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101418; --panel: #171c22; --sunken: #13181d; --ink: #e6eaee; --ink-2: #aab4be; --ink-3: #7a8692;
  --line: #262e37; --line-2: #34404b; --focus: #5c9cf0; --c-queued: #6f7c89; --c-active: #4c96ec;
  --c-done: #3db27a; --c-failed: #ec6b61; --c-stopped: #a78ad6; --feed: #13181d; --code-bg: #1c232a;
  --add: #4cc28a; --del: #f07c73; --add-bg: rgba(76, 194, 138, .1); --del-bg: rgba(240, 124, 115, .1);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code, kbd { font-family: var(--mono); font-size: 12px; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.top {
  height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 16px;
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.top h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
.meter { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.meter .cells { display: flex; gap: 3px; }
.meter .cells i { width: 14px; height: 6px; border-radius: 2px; background: var(--line-2); }
.meter .cells i.on { background: var(--c-active); }
.top .warn { margin-left: auto; display: flex; gap: 8px; }
.pill-warn {
  font-size: 12.5px; padding: 3px 10px; border-radius: 999px; cursor: pointer; border: 0;
  background: color-mix(in srgb, var(--c-failed) 13%, transparent); color: var(--c-failed);
}

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 48px); }
.side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--sunken); }
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); }

/* ---------- composer ---------- */
.composer { padding: 14px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; background: var(--panel); }
.field { display: grid; gap: 5px; }
.field > span { font-size: 12.5px; font-weight: 550; color: var(--ink-2); }
.input {
  width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line-2);
  background: var(--panel); transition: border-color .12s;
}
.input:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
textarea.input { resize: none; min-height: 84px; max-height: 260px; line-height: 1.45; overflow-y: auto; }
.repo-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line-2); background: var(--sunken); border-radius: 999px; padding: 2px 10px;
  font-size: 12.5px; cursor: pointer; color: var(--ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip[aria-pressed="true"] { border-color: var(--focus); color: var(--focus); background: color-mix(in srgb, var(--focus) 8%, transparent); }
.opts { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.opts label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.opts details summary { cursor: pointer; list-style: none; }
.opts details summary::-webkit-details-marker { display: none; }
.opts details[open] { flex-basis: 100%; }
.opts details .input { margin-top: 6px; }
.launch-row { display: flex; align-items: center; gap: 10px; }
.hint { color: var(--ink-3); font-size: 12px; }
.hint kbd { border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; font-size: 11px; }
.btn {
  border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer;
  background: var(--ink); color: var(--panel); white-space: nowrap;
}
.btn.primary { background: var(--focus); color: #fff; margin-left: auto; }
.btn.subtle { background: var(--sunken); color: var(--ink); border: 1px solid var(--line-2); font-weight: 550; }
.btn.danger { background: transparent; color: var(--c-failed); border: 1px solid color-mix(in srgb, var(--c-failed) 45%, transparent); }
.btn:disabled { opacity: .45; cursor: default; }
.form-error { margin: 0; color: var(--c-failed); font-size: 13px; }

/* ---------- agents list ---------- */
.list { flex: 1; overflow-y: auto; padding: 8px 8px 24px; }
.group { margin-top: 10px; }
.group h2 { margin: 0 6px 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); display: flex; gap: 6px; }
.group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.agent {
  width: 100%; text-align: left; cursor: pointer; display: grid; grid-template-columns: 10px 1fr auto;
  gap: 2px 10px; align-items: start; padding: 9px 10px; border-radius: var(--r);
  border: 1px solid transparent; background: transparent;
}
.agent:hover { background: var(--panel); border-color: var(--line); }
.agent[aria-current="true"] { background: var(--panel); border-color: var(--line-2); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-top: 6px; }
.agent.live .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 22%, transparent); } }
@media (prefers-reduced-motion: reduce) { .agent.live .dot { animation: none; } }
.agent .p { font-weight: 550; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
.agent .t { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.agent .m { grid-column: 2 / 4; color: var(--ink-3); font-size: 12px; display: flex; gap: 8px; }
.agent .m .s { color: var(--c); font-weight: 550; }
.empty-list { color: var(--ink-3); padding: 18px 12px; font-size: 13px; }

.k-queued { --c: var(--c-queued); }
.k-active { --c: var(--c-active); }
.k-done { --c: var(--c-done); }
.k-no_changes { --c: var(--c-queued); }
.k-failed { --c: var(--c-failed); }
.k-stopped { --c: var(--c-stopped); }

/* ---------- detail ---------- */
.welcome { margin: auto; max-width: 460px; padding: 32px 24px; }
.welcome h2 { font-size: 20px; margin: 0 0 6px; letter-spacing: -0.01em; }
.welcome p { color: var(--ink-2); margin: 0 0 18px; }
.welcome ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: s; }
.welcome li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; color: var(--ink-2); counter-increment: s; }
.welcome li::before {
  content: counter(s); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  background: var(--sunken); border: 1px solid var(--line-2); font-size: 12px; font-weight: 600; color: var(--ink);
}
.welcome li b { color: var(--ink); font-weight: 600; display: block; }

.head { padding: 16px 20px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.head-top { display: flex; align-items: flex-start; gap: 16px; }
.head h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.4; white-space: pre-wrap; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.head .actions { display: flex; gap: 8px; flex-shrink: 0; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-3); font-size: 12.5px; }
.facts b { color: var(--ink-2); font-weight: 550; }
.facts .st { color: var(--c); font-weight: 600; }

.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.step { display: grid; gap: 5px; font-size: 11.5px; color: var(--ink-3); }
.step i { height: 4px; border-radius: 2px; background: var(--line); }
.step.done i { background: var(--c); }
.step.now i { background: var(--c); }
.step.now { color: var(--ink); font-weight: 600; }
.k-active .step.now i { animation: grow 1.6s ease-in-out infinite; transform-origin: left; }
@keyframes grow { 0% { opacity: .45; } 50% { opacity: 1; } 100% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .k-active .step.now i { animation: none; } }

.outcome {
  border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px;
  background: color-mix(in srgb, var(--c) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
}
.outcome .title { font-weight: 600; color: var(--ink); }
.outcome .why { color: var(--ink-2); font-size: 13px; }
.outcome .detail-code { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: pre-wrap; max-height: 8em; overflow: auto; }
.cmd { display: flex; align-items: center; gap: 8px; }
.cmd code {
  flex: 1; min-width: 0; padding: 6px 10px; border-radius: 6px; background: var(--code-bg);
  overflow-x: auto; white-space: nowrap;
}
.copy { border: 1px solid var(--line-2); background: var(--panel); border-radius: 6px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; }

.tabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.tabs button {
  background: none; border: 0; padding: 10px 8px; margin-bottom: -1px; cursor: pointer; color: var(--ink-3);
  border-bottom: 2px solid transparent; font-weight: 550; display: inline-flex; gap: 6px; align-items: center;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs .count { font-size: 11.5px; background: var(--sunken); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; color: var(--ink-2); }

.pane { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
.feed { padding: 16px 20px 40px; background: var(--feed); display: grid; gap: 8px; align-content: start; min-height: 100%; }
.f-meta { color: var(--ink-3); font-size: 12px; }
.f-text { white-space: pre-wrap; line-height: 1.55; max-width: 78ch; overflow-wrap: anywhere; padding: 2px 0 4px; }
.f-tool { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.f-tool summary {
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
  padding: 7px 10px; cursor: pointer; list-style: none;
}
.f-tool summary::-webkit-details-marker { display: none; }
.f-tool .name { font-size: 11.5px; font-weight: 650; padding: 1px 7px; border-radius: 4px; background: var(--code-bg); color: var(--ink-2); }
.f-tool .sum { font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.f-tool .flag { font-size: 11.5px; color: var(--ink-3); }
.f-tool .flag.err { color: var(--c-failed); font-weight: 600; }
.f-tool .flag.wait { color: var(--c-active); }
.f-tool pre {
  margin: 0; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--code-bg);
  font: 12px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow-y: auto;
}
.f-tool pre.full-cmd { background: var(--panel); }
.f-retry { color: var(--c-active); font-size: 12.5px; }
.f-final {
  margin-top: 6px; padding: 10px 12px; border-radius: var(--r); font-size: 13px;
  background: var(--sunken); border: 1px solid var(--line); color: var(--ink-2);
}
.f-raw { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.jump {
  position: sticky; bottom: 14px; margin-left: auto; margin-right: 20px; display: block;
  border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 5px 12px;
  font-size: 12.5px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12);
}

.diff { padding: 14px 20px 40px; display: grid; gap: 12px; align-content: start; }
.diff-file { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.diff-file summary {
  display: flex; gap: 10px; align-items: center; padding: 8px 12px; cursor: pointer; background: var(--sunken);
  list-style: none; font-family: var(--mono); font-size: 12.5px;
}
.diff-file summary::-webkit-details-marker { display: none; }
.diff-file .path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.plus { color: var(--add); } .minus { color: var(--del); }
.diff-body { font: 12px/1.6 var(--mono); overflow-x: auto; }
.diff-body div { padding: 0 12px; white-space: pre; min-height: 1.6em; }
.diff-body .a { background: var(--add-bg); color: var(--add); }
.diff-body .d { background: var(--del-bg); color: var(--del); }
.diff-body .h { color: var(--ink-3); background: var(--sunken); }
.diff-summary { color: var(--ink-2); font-size: 13px; }
.muted-box { color: var(--ink-3); padding: 24px 20px; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .list { max-height: 45vh; }
  .main { min-height: 75vh; }
  .head-top { flex-direction: column; }
  .meter span { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <h1>agentvm</h1>
  <div class="meter" title="VM al lavoro sul totale disponibile">
    <div class="cells" id="cells"></div><span id="meter-text"></span>
  </div>
  <div class="warn" id="warn"></div>
</header>

<div class="app">
  <aside class="side">
    <form class="composer" id="composer" autocomplete="off">
      <label class="field">
        <span>Repository</span>
        <input class="input" name="repo_path" id="repo" placeholder="~/progetti/mio-repo" required spellcheck="false">
      </label>
      <div class="chips" id="recent" aria-label="Repository recenti"></div>
      <label class="field">
        <span id="prompt-label">Cosa deve fare l'agente</span>
        <textarea class="input" name="prompt" id="prompt" rows="3" required
          placeholder="Es. Correggi il test che fallisce in parser.rs e fai commit."></textarea>
      </label>
      <div class="opts">
        <label><input type="checkbox" id="batch"> Un agente per ogni riga</label>
        <details>
          <summary>Parti da un altro branch</summary>
          <input class="input" name="base_ref" placeholder="HEAD (default)" spellcheck="false">
        </details>
      </div>
      <div class="launch-row">
        <span class="hint"><kbd>⌘ Invio</kbd> per avviare</span>
        <button class="btn primary" type="submit" id="launch">Avvia agente</button>
      </div>
      <p class="form-error" id="form-error" role="alert" hidden></p>
    </form>
    <nav class="list" id="list" aria-label="Agenti"></nav>
  </aside>

  <main class="main" id="main"></main>
</div>

<template id="welcome-tpl">
  <div class="welcome">
    <h2>Fai lavorare Claude in parallelo, al sicuro</h2>
    <p>Ogni agente gira in una VM Debian usa-e-getta con pieni permessi. Il tuo Mac e il tuo repo restano intatti finché non decidi tu.</p>
    <ol>
      <li><div><b>Scegli il repository</b>L'agente parte dall'ultimo commit: le modifiche non salvate restano solo tue.</div></li>
      <li><div><b>Descrivi il compito</b>Più è preciso, migliore è il risultato. Con "Un agente per ogni riga" ne lanci diversi insieme.</div></li>
      <li><div><b>Rivedi il branch</b>Alla fine trovi <code>agent/…</code> nel repo, con le modifiche pronte da controllare e unire.</div></li>
    </ol>
  </div>
</template>

<template id="detail-tpl">
  <div class="head">
    <div class="head-top">
      <h2 data-prompt></h2>
      <div class="actions">
        <button class="btn danger" type="button" data-stop hidden>Ferma</button>
        <button class="btn subtle" type="button" data-again hidden>Riusa il prompt</button>
      </div>
    </div>
    <div class="facts">
      <span class="st" data-state></span>
      <span><b data-elapsed></b></span>
      <span title="" data-repo-wrap>Repo <b data-repo></b></span>
      <span>Da <b data-base></b></span>
    </div>
    <div class="steps" data-steps></div>
    <div class="outcome" data-outcome hidden></div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="feed">Attività <span class="count" data-feed-count>0</span></button>
    <button role="tab" aria-selected="false" data-tab="diff">Modifiche <span class="count" data-diff-count hidden></span></button>
  </div>
  <div class="pane" data-pane-feed>
    <div class="feed" data-feed aria-live="polite"></div>
    <button class="jump" type="button" data-jump hidden>Vai all'ultima attività</button>
  </div>
  <div class="pane" data-pane-diff hidden><div class="diff" data-diff></div></div>
</template>

<script>
"use strict";
const PHASES = ["queued", "preparing", "booting", "running", "collecting"];
const PHASE_LABEL = ["In coda", "Preparazione", "Avvio VM", "Al lavoro", "Raccolta"];
const LABEL = {
  queued: "In coda", preparing: "Preparazione", booting: "Avvio della VM", running: "Al lavoro",
  collecting: "Raccolta del risultato", done: "Completato", no_changes: "Nessuna modifica",
  failed: "Non riuscito", stopped: "Fermato",
};
const TERMINAL = new Set(["done", "no_changes", "failed", "stopped"]);
const isLive = s => PHASES.includes(s) && s !== "queued";
const kind = s => "k-" + (isLive(s) ? "active" : s);

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid);
  return e;
}
const repoName = p => p.split("/").filter(Boolean).pop() || p;
const shortPath = p => p.replace(/^\/Users\/[^/]+/, "~");

function duration(t) {
  const end = t.finished_at ?? Date.now() / 1000;
  const s = Math.max(0, Math.round(end - t.created_at));
  if (s < 60) return `${s} s`;
  const m = Math.floor(s / 60);
  return m < 60 ? `${m} min ${s % 60} s` : `${Math.floor(m / 60)} h ${m % 60} min`;
}

/** Motivi di fallimento in linguaggio umano; il codice originale resta visibile sotto. */
function explain(reason = "") {
  if (reason === "timeout") return ["Tempo massimo superato", "L'agente ha lavorato per più del limite impostato (AGENTVM_TIMEOUT_S) ed è stato fermato."];
  if (reason === "guest_no_result") return ["La VM si è spenta senza un risultato", "Il job nella VM non ha scritto result.json. Controlla console.log nella cartella del job."];
  if (reason === "missing_out_bundle") return ["Nessun commit da importare", "Claude ha finito, ma il branch con i commit non è stato prodotto."];
  if (reason.startsWith("claude_exit")) return ["Claude si è fermato con un errore", "Leggi l'ultima attività qui sotto per capire dove si è bloccato."];
  if (reason.startsWith("vm_error")) return ["La VM non è partita", "Virtualization.framework ha riportato un errore."];
  if (reason.startsWith("fetch_failed")) return ["Impossibile importare il branch nel repo", "Il lavoro è finito ma git fetch non è riuscito."];
  if (reason.startsWith("guest_error")) return ["Errore dentro la VM", "Lo script del job si è interrotto."];
  if (reason.includes("token")) return ["Token Claude mancante", "Salvalo nel Portachiavi e riprova."];
  return ["Non riuscito", ""];
}

let tasks = [];
let selected = null;
let source = null;
let status = { running: 0, concurrency: 4, golden: true, token: true };
const unseenDone = new Set();

// ---------- top bar ----------
async function loadStatus() {
  try { status = await (await fetch("/api/status")).json(); } catch { return; }
  const cells = $("#cells");
  cells.replaceChildren(...Array.from({ length: status.concurrency }, (_, i) => h("i", { class: i < status.running ? "on" : "" })));
  const queued = tasks.filter(t => t.status.state === "queued").length;
  $("#meter-text").textContent = `${status.running} di ${status.concurrency} VM al lavoro` + (queued ? `, ${queued} in coda` : "");
  const warn = $("#warn");
  warn.replaceChildren();
  if (!status.golden) warn.append(h("button", { class: "pill-warn", type: "button", onclick: () => showSetup("golden") }, "Manca l'immagine della VM"));
  if (!status.token) warn.append(h("button", { class: "pill-warn", type: "button", onclick: () => showSetup("token") }, "Manca il token Claude"));
  updateLaunch();
}

function showSetup(what) {
  selectNone();
  const box = what === "golden"
    ? [h("h2", {}, "Crea l'immagine della VM"), h("p", {}, "Serve una volta sola, circa 2 minuti. Dalla cartella del progetto:"), cmdRow("scripts/build-golden.sh")]
    : [h("h2", {}, "Collega il tuo account Claude"), h("p", {}, "Genera un token dell'abbonamento e salvalo nel Portachiavi (il comando chiede di incollarlo):"),
       cmdRow("claude setup-token"), cmdRow("security add-generic-password -U -s agentvm -a agentvm -w")];
  $("#main").replaceChildren(h("div", { class: "welcome" }, ...box));
}

// ---------- recent repos ----------
const RECENT_KEY = "agentvm.recentRepos";
function recentRepos() {
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch {}
  const fromTasks = tasks.map(t => shortPath(t.repo));
  return [...new Set([...saved, ...fromTasks])].slice(0, 6);
}
function rememberRepo(path) {
  const list = [path, ...recentRepos().filter(p => p !== path)].slice(0, 6);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch {}
}
function renderRecent() {
  const current = $("#repo").value.trim();
  $("#recent").replaceChildren(...recentRepos().map(p =>
    h("button", { class: "chip", type: "button", title: p, "aria-pressed": String(p === current),
      onclick: () => { $("#repo").value = p; renderRecent(); $("#prompt").focus(); } }, repoName(p))));
}

// ---------- composer ----------
const promptEl = $("#prompt");
function prompts() {
  const text = promptEl.value.trim();
  if (!text) return [];
  return $("#batch").checked ? text.split("\n").map(l => l.replace(/^\s*[-*•\d.)]+\s*/, "").trim()).filter(Boolean) : [text];
}
function updateLaunch() {
  const n = prompts().length;
  const btn = $("#launch");
  btn.textContent = n > 1 ? `Avvia ${n} agenti` : "Avvia agente";
  btn.disabled = !status.golden || !status.token || n === 0 || !$("#repo").value.trim();
  $("#prompt-label").textContent = $("#batch").checked ? "Un compito per riga, un agente per compito" : "Cosa deve fare l'agente";
}
function autosize() { promptEl.style.height = "auto"; promptEl.style.height = Math.min(promptEl.scrollHeight + 2, 260) + "px"; }
promptEl.addEventListener("input", () => { autosize(); updateLaunch(); });
$("#repo").addEventListener("input", () => { renderRecent(); updateLaunch(); });
$("#batch").addEventListener("change", updateLaunch);
$("#composer").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("#composer").requestSubmit(); }
});

$("#composer").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target;
  const list = prompts();
  const repo_path = form.repo_path.value.trim();
  const base_ref = form.base_ref.value.trim() || undefined;
  const err = $("#form-error");
  err.hidden = true;
  $("#launch").disabled = true;
  const ids = [];
  for (const prompt of list) {
    const res = await fetch("/api/tasks", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ repo_path, prompt, base_ref }),
    });
    const data = await res.json().catch(() => ({ error: "Risposta non valida dal server" }));
    if (!res.ok) { err.textContent = data.error; err.hidden = false; break; }
    ids.push(data.id);
  }
  if (ids.length) {
    rememberRepo(repo_path);
    promptEl.value = "";
    autosize();
    await loadTasks();
    select(ids[0]);
  }
  updateLaunch();
  loadStatus();
});

// ---------- list ----------
async function loadTasks() {
  let next;
  try { next = await (await fetch("/api/tasks")).json(); } catch { return; }
  for (const t of next) {
    const before = tasks.find(x => x.id === t.id);
    if (before && !TERMINAL.has(before.status.state) && TERMINAL.has(t.status.state) && t.id !== selected) unseenDone.add(t.id);
  }
  tasks = next;
  renderList();
  renderRecent();
  if (selected) { const t = tasks.find(t => t.id === selected); if (t) renderHead(t); }
  document.title = unseenDone.size ? `(${unseenDone.size}) agentvm` : "agentvm";
}

function renderList() {
  const nav = $("#list");
  if (!tasks.length) { nav.replaceChildren(h("p", { class: "empty-list" }, "Gli agenti che avvii compaiono qui.")); return; }
  const groups = [
    ["Al lavoro", tasks.filter(t => isLive(t.status.state))],
    ["In coda", tasks.filter(t => t.status.state === "queued")],
    ["Finiti", tasks.filter(t => TERMINAL.has(t.status.state))],
  ].filter(([, list]) => list.length);
  nav.replaceChildren(...groups.map(([title, list]) =>
    h("section", { class: "group" },
      h("h2", {}, title, h("span", {}, String(list.length))),
      h("ul", {}, list.map(agentRow)))));
}

function agentRow(t) {
  const s = t.status.state;
  const extra = s === "done" ? `${t.status.commits} commit` : unseenDone.has(t.id) ? "nuovo" : null;
  return h("li", {}, h("button", {
      class: `agent ${kind(s)}${isLive(s) ? " live" : ""}`, type: "button",
      "aria-current": String(t.id === selected), onclick: () => select(t.id),
    },
    h("span", { class: "dot" }),
    h("span", { class: "p" }, t.prompt),
    h("span", { class: "t", "data-elapsed-for": t.id }, duration(t)),
    h("span", { class: "m" }, h("span", { class: "s" }, LABEL[s] ?? s), h("span", {}, repoName(t.repo)), extra && h("span", {}, extra))));
}

// ---------- detail ----------
function selectNone() {
  selected = null;
  if (source) { source.close(); source = null; }
  history.replaceState(null, "", location.pathname);
  renderList();
}

function welcome() { $("#main").replaceChildren($("#welcome-tpl").content.cloneNode(true)); }

function select(id) {
  selected = id;
  unseenDone.delete(id);
  history.replaceState(null, "", "#" + id);
  if (source) source.close();
  $("#main").replaceChildren($("#detail-tpl").content.cloneNode(true));
  const t = tasks.find(t => t.id === id);
  if (t) renderHead(t);
  renderList();
  document.title = unseenDone.size ? `(${unseenDone.size}) agentvm` : "agentvm";

  for (const tab of $$("[data-tab]")) tab.addEventListener("click", () => showTab(tab.dataset.tab));
  $("[data-stop]").addEventListener("click", stopSelected);
  $("[data-again]").addEventListener("click", () => {
    const t = tasks.find(t => t.id === selected);
    if (!t) return;
    $("#repo").value = shortPath(t.repo);
    promptEl.value = t.prompt;
    autosize(); renderRecent(); updateLaunch(); promptEl.focus();
  });
  const pane = $("[data-pane-feed]");
  pane.addEventListener("scroll", () => { $("[data-jump]").hidden = nearBottom(pane); });
  $("[data-jump]").addEventListener("click", () => { pane.scrollTop = pane.scrollHeight; });

  feedState = { lastTool: null, count: 0 };
  source = new EventSource(`/api/tasks/${id}/events`);
  source.addEventListener("state", e => onState(JSON.parse(e.data)));
  source.addEventListener("agent", e => onAgent(JSON.parse(e.data)));
  if (t && t.status.state === "done") loadDiff(true);
}

function renderHead(t) {
  const s = t.status.state;
  const root = $("#main");
  if (!$("[data-prompt]", root)) return;
  root.className = `main ${kind(s)}`;
  $("[data-prompt]").textContent = t.prompt;
  $("[data-state]").textContent = LABEL[s] ?? s;
  $("[data-elapsed]").textContent = duration(t);
  $("[data-elapsed]").dataset.elapsedFor = t.id;
  $("[data-repo]").textContent = repoName(t.repo);
  $("[data-repo-wrap]").title = t.repo;
  $("[data-base]").textContent = t.base_sha.slice(0, 8);
  $("[data-stop]").hidden = TERMINAL.has(s);
  $("[data-again]").hidden = !TERMINAL.has(s);

  const reached = TERMINAL.has(s) ? (s === "done" || s === "no_changes" ? PHASES.length : -1) : PHASES.indexOf(s);
  $("[data-steps]").replaceChildren(...PHASES.map((p, i) => {
    const cls = TERMINAL.has(s) && reached === PHASES.length ? "done" : i < reached ? "done" : i === reached ? "now" : "";
    return h("div", { class: `step ${cls}` }, h("i"), PHASE_LABEL[i]);
  }));
  $("[data-steps]").hidden = TERMINAL.has(s) && s !== "done" && s !== "no_changes";
  renderOutcome(t);
}

function cmdRow(text) {
  const btn = h("button", { class: "copy", type: "button" }, "Copia");
  btn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copiato"; } catch { btn.textContent = "Seleziona e copia"; }
    setTimeout(() => (btn.textContent = "Copia"), 1600);
  });
  return h("div", { class: "cmd" }, h("code", {}, text), btn);
}

function renderOutcome(t) {
  const box = $("[data-outcome]");
  const s = t.status.state;
  if (!TERMINAL.has(s)) { box.hidden = true; return; }
  box.hidden = false;
  const repo = shortPath(t.repo).replace(/ /g, "\\ ");
  if (s === "done") {
    box.replaceChildren(
      h("div", { class: "title" }, `Branch ${t.branch} creato con ${t.status.commits} commit`),
      h("div", { class: "why" }, "È già nel tuo repository. Per provarlo o unirlo:"),
      cmdRow(`git -C ${repo} switch ${t.branch}`),
      cmdRow(`git -C ${repo} merge ${t.branch}`));
  } else if (s === "no_changes") {
    box.replaceChildren(h("div", { class: "title" }, "L'agente ha finito senza modificare file"),
      h("div", { class: "why" }, "Leggi la risposta finale qui sotto: a volte serve un prompt più preciso."));
  } else if (s === "stopped") {
    box.replaceChildren(h("div", { class: "title" }, "Fermato da te"), h("div", { class: "why" }, "La VM è stata spenta e il disco eliminato. Nessun branch creato."));
  } else {
    const [title, why] = explain(t.status.reason);
    box.replaceChildren(h("div", { class: "title" }, title), why && h("div", { class: "why" }, why),
      h("div", { class: "detail-code" }, t.status.reason ?? ""));
  }
}

function showTab(name) {
  for (const tab of $$("[data-tab]")) tab.setAttribute("aria-selected", String(tab.dataset.tab === name));
  $("[data-pane-feed]").hidden = name !== "feed";
  $("[data-pane-diff]").hidden = name !== "diff";
  if (name === "diff") loadDiff(false);
}

async function stopSelected(e) {
  e.target.disabled = true;
  e.target.textContent = "Arresto…";
  await fetch(`/api/tasks/${selected}/stop`, { method: "POST" });
  loadTasks();
}

// ---------- feed ----------
let feedState = { lastTool: null, count: 0 };
const nearBottom = el => el.scrollHeight - el.scrollTop - el.clientHeight < 60;

function pushFeed(node) {
  const pane = $("[data-pane-feed]");
  if (!pane) return;
  const stick = nearBottom(pane);
  $("[data-feed]").append(node);
  if (stick) pane.scrollTop = pane.scrollHeight;
  else $("[data-jump]").hidden = false;
}

function onState(st) {
  const t = tasks.find(t => t.id === selected);
  if (!t) return;
  t.status = st;
  if (TERMINAL.has(st.state) && !t.finished_at) t.finished_at = Date.now() / 1000;
  renderHead(t);
  renderList();
  if (TERMINAL.has(st.state)) { loadTasks(); if (st.state === "done") loadDiff(true); }
}

function onAgent(ev) {
  feedState.count++;
  const counter = $("[data-feed-count]");
  if (counter) counter.textContent = String(feedState.count);
  switch (ev.kind) {
    case "init": pushFeed(h("div", { class: "f-meta" }, `Claude Code avviato nella VM, modello ${ev.model}`)); break;
    case "text": pushFeed(h("div", { class: "f-text" }, ev.text)); break;
    case "tool_use": {
      const flag = h("span", { class: "flag wait" }, "in corso");
      const details = h("details", { class: "f-tool" },
        h("summary", {}, h("span", { class: "name" }, ev.name), h("span", { class: "sum", title: ev.summary }, firstLine(ev.summary)), flag));
      if (ev.summary.includes("\n") || ev.summary.length > 90) details.append(h("pre", { class: "full-cmd" }, ev.summary));
      feedState.lastTool = { details, flag };
      pushFeed(details);
      break;
    }
    case "tool_result": {
      const tool = feedState.lastTool;
      const out = ev.summary.trim();
      if (!tool) { pushFeed(h("div", { class: "f-raw" }, out)); break; }
      tool.flag.className = `flag${ev.is_error ? " err" : ""}`;
      tool.flag.textContent = ev.is_error ? "errore" : out ? `${out.split("\n").length} righe` : "ok";
      if (out) tool.details.append(h("pre", {}, out));
      if (ev.is_error) tool.details.open = true;
      feedState.lastTool = null;
      break;
    }
    case "retry": pushFeed(h("div", { class: "f-retry" }, `API di Claude non raggiungibile, nuovo tentativo (${ev.attempt})`)); break;
    case "result": {
      const secs = (ev.duration_ms / 1000).toFixed(1);
      pushFeed(h("div", { class: "f-final" },
        `${ev.is_error ? "Claude ha terminato con un errore" : "Claude ha finito"} in ${secs} s. Costo equivalente API: $${ev.cost_usd.toFixed(3)}.`));
      break;
    }
    default: if (ev.raw && ev.raw.trim()) pushFeed(h("div", { class: "f-raw" }, ev.raw.slice(0, 500)));
  }
}
const firstLine = s => { const l = s.split("\n")[0]; return s.includes("\n") ? l + " …" : l; };

// ---------- diff ----------
let diffFor = null;
async function loadDiff(countOnly) {
  const id = selected;
  if (diffFor === id && countOnly) return;
  const res = await fetch(`/api/tasks/${id}/diff`);
  if (id !== selected) return;
  const box = $("[data-diff]");
  if (!res.ok) {
    const msg = (await res.json().catch(() => ({}))).error || "Modifiche non disponibili";
    box.replaceChildren(h("div", { class: "muted-box" }, msg === "il task non ha prodotto un branch" ? "Le modifiche compaiono qui quando l'agente ha finito e ha creato il branch." : msg));
    return;
  }
  diffFor = id;
  const files = parseDiff(await res.text());
  const count = $("[data-diff-count]");
  count.hidden = false;
  count.textContent = `${files.length} file`;
  if (!files.length) { box.replaceChildren(h("div", { class: "muted-box" }, "Il branch non contiene modifiche ai file.")); return; }
  const add = files.reduce((n, f) => n + f.add, 0), del = files.reduce((n, f) => n + f.del, 0);
  box.replaceChildren(
    h("div", { class: "diff-summary" }, `${files.length} file modificati, `, h("span", { class: "plus" }, `+${add}`), " ", h("span", { class: "minus" }, `−${del}`)),
    ...files.map((f, i) => h("details", { class: "diff-file", open: files.length <= 4 || i === 0 },
      h("summary", {}, h("span", { class: "path", title: f.path }, f.path), h("span", { class: "plus" }, `+${f.add}`), h("span", { class: "minus" }, `−${f.del}`)),
      h("div", { class: "diff-body" }, f.lines.map(l => h("div", {
        class: l.startsWith("@@") ? "h" : l.startsWith("+") ? "a" : l.startsWith("-") ? "d" : "" }, l))))));
}

function parseDiff(text) {
  const files = [];
  let cur = null;
  for (const line of text.split("\n")) {
    if (line.startsWith("diff --git")) {
      const m = line.match(/ b\/(.+)$/);
      cur = { path: m ? m[1] : line, add: 0, del: 0, lines: [] };
      files.push(cur);
    } else if (!cur || /^(index |--- |\+\+\+ |new file mode|deleted file mode|similarity |rename )/.test(line)) {
      continue;
    } else {
      if (line.startsWith("+")) cur.add++;
      else if (line.startsWith("-")) cur.del++;
      cur.lines.push(line);
    }
  }
  return files;
}

// ---------- tick + polling ----------
setInterval(() => {
  for (const el of $$("[data-elapsed-for]")) {
    const t = tasks.find(t => t.id === el.dataset.elapsedFor);
    if (t && !TERMINAL.has(t.status.state)) el.textContent = duration(t);
  }
}, 1000);

(async () => {
  try { $("#repo").value = recentRepos()[0] ?? ""; } catch {}
  await loadTasks();
  await loadStatus();
  const fromHash = location.hash.slice(1);
  if (fromHash && tasks.some(t => t.id === fromHash)) select(fromHash);
  else if (tasks.length) select((tasks.find(t => isLive(t.status.state)) ?? tasks[0]).id);
  else welcome();
  if (!$("#repo").value) $("#repo").value = recentRepos()[0] ?? "";
  renderRecent();
  updateLaunch();
  setInterval(() => { loadTasks(); loadStatus(); }, 2000);
})();
</script>
</body>
</html>
