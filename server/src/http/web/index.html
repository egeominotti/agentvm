<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentvm</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
:root {
  --bg: #0f1317;
  --panel: #161b21;
  --raised: #1c232a;
  --ink: #e6eaee;
  --ink-2: #a9b3bd;
  --ink-3: #737f8b;
  --line: #252d36;
  --line-2: #323d48;
  --focus: #5c9cf0;
  --c-boot: #7b8794;
  --c-work: #4c96ec;
  --c-wait: #e2a93b;
  --c-done: #3db27a;
  --c-failed: #ec6b61;
  --c-stopped: #a78ad6;
  --term-bg: #0b0e11;
  --add: #4cc28a;
  --del: #f07c73;
  --add-bg: rgba(76, 194, 138, .1);
  --del-bg: rgba(240, 124, 115, .1);
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13.5px/1.45 var(--ui); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code, kbd { font-family: var(--mono); font-size: 12px; }
[hidden] { display: none !important; }

/* ---------- barra superiore + lanciatore ---------- */
.top { display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand { font-weight: 650; font-size: 14.5px; letter-spacing: -0.01em; }
.meter { display: flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
.meter .bar { width: 72px; height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--c-work); width: 0; transition: width .3s; }
.launcher { display: flex; gap: 8px; align-items: center; flex: 1; min-width: 320px; }
.repo-wrap { position: relative; width: 260px; flex-shrink: 0; }
.input {
  width: 100%; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--raised);
}
.input:focus { border-color: var(--focus); outline: none; }
textarea.input { resize: none; height: 32px; max-height: 160px; line-height: 1.4; overflow-y: hidden; }
textarea.input.tall { overflow-y: auto; }
.prompt-wrap { flex: 1; min-width: 160px; }
.recent {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20; background: var(--raised);
  border: 1px solid var(--line-2); border-radius: 8px; padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.recent button {
  display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 5px; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.recent button:hover, .recent button:focus-visible { background: var(--line); }
.recent small { color: var(--ink-3); margin-left: 6px; }
.batch { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; cursor: pointer; }
.btn {
  border: 0; border-radius: 6px; padding: 6px 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  background: var(--raised); color: var(--ink); border: 1px solid var(--line-2);
}
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn.primary { background: var(--focus); border-color: var(--focus); color: #fff; }
.btn.danger { color: var(--c-failed); }
.btn:disabled { opacity: .45; cursor: default; }
.warn { display: flex; gap: 6px; }
.pill-warn { font-size: 12px; padding: 3px 10px; border-radius: 999px; cursor: pointer; border: 0; background: rgba(236,107,97,.15); color: var(--c-failed); }
.form-error { color: var(--c-failed); font-size: 12.5px; padding: 6px 14px; background: rgba(236,107,97,.08); border-bottom: 1px solid var(--line); }

/* ---------- schede dei terminali ---------- */
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: var(--bg); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tab {
  display: flex; align-items: center; gap: 8px; max-width: 240px; min-width: 120px; padding: 7px 12px; cursor: pointer;
  border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--ink-2);
}
.tab:hover { background: var(--panel); }
.tab[aria-selected="true"] { background: var(--panel); border-color: var(--line); color: var(--ink); margin-bottom: -1px; }
.tab .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: left; }
.tab.ended { opacity: .6; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
.s-boot { --c: var(--c-boot); } .s-work { --c: var(--c-work); } .s-wait { --c: var(--c-wait); }
.s-done { --c: var(--c-done); } .s-failed { --c: var(--c-failed); } .s-stopped { --c: var(--c-stopped); } .s-none { --c: var(--c-boot); }
.s-work .dot, .s-boot .dot { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }

/* ---------- area di lavoro ---------- */
.work { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--panel); overflow: hidden; }
.toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 5px 12px; cursor: pointer; color: var(--ink-2); font-weight: 550; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); }
.status { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 12.5px; }
.status b { color: var(--ink); font-weight: 600; }
.toolbar .spacer { flex: 1; }
.toolbar .saved { color: var(--c-done); font-size: 12.5px; }
.term-area { flex: 1; min-height: 0; position: relative; background: var(--term-bg); overflow: hidden; }
.term { position: absolute; inset: 0; padding: 8px 4px 4px 10px; }
.term .xterm { height: 100%; }
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-2);
  background: color-mix(in srgb, var(--term-bg) 88%, transparent); z-index: 5; padding: 24px;
}
.overlay b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

.empty { margin: auto; max-width: 520px; padding: 40px 24px; }
.empty h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.015em; }
.empty p { color: var(--ink-2); margin: 0 0 18px; }
.empty ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; color: var(--ink-2); }
.empty li b { color: var(--ink); }

/* ---------- esito + modifiche ---------- */
.result { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px 40px; display: grid; gap: 14px; align-content: start; }
.outcome { border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); background: color-mix(in srgb, var(--c) 7%, var(--panel)); }
.outcome .title { font-weight: 600; }
.outcome .why { color: var(--ink-2); font-size: 13px; }
.outcome .code { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: pre-wrap; }
.cmd { display: flex; align-items: center; gap: 8px; }
.cmd code { flex: 1; min-width: 0; padding: 6px 10px; border-radius: 6px; background: var(--raised); overflow-x: auto; white-space: nowrap; }
.copy { border: 1px solid var(--line-2); background: var(--panel); border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
.diff-summary { color: var(--ink-2); font-size: 13px; }
.diff-file { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.diff-file summary { display: flex; gap: 10px; align-items: center; padding: 7px 12px; cursor: pointer; background: var(--raised); list-style: none; font-family: var(--mono); font-size: 12.5px; }
.diff-file summary::-webkit-details-marker { display: none; }
.diff-file .path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plus { color: var(--add); } .minus { color: var(--del); }
.diff-body { font: 12px/1.6 var(--mono); overflow-x: auto; }
.diff-body div { padding: 0 12px; white-space: pre; min-height: 1.6em; }
.diff-body .a { background: var(--add-bg); color: var(--add); }
.diff-body .d { background: var(--del-bg); color: var(--del); }
.diff-body .h { color: var(--ink-3); background: var(--raised); }

@media (max-width: 760px) {
  .launcher { flex-wrap: wrap; min-width: 0; }
  .repo-wrap { width: 100%; }
}
</style>
</head>
<body>
<header class="top">
  <span class="brand">agentvm</span>
  <span class="meter" title="VM accese sul massimo che la RAM del Mac regge"><span class="bar"><i id="meter-bar"></i></span><span id="meter-text"></span></span>
  <form class="launcher" id="launcher" autocomplete="off">
    <div class="repo-wrap">
      <input class="input" id="repo" name="repo_path" placeholder="Repository, es. ~/progetti/app" spellcheck="false" required>
      <div class="recent" id="recent" hidden></div>
    </div>
    <div class="prompt-wrap">
      <textarea class="input" id="prompt" name="prompt" rows="1" placeholder="Compito iniziale per Claude (facoltativo)"></textarea>
    </div>
    <label class="batch" title="Ogni riga del compito apre un terminale con il suo agente"><input type="checkbox" id="batch"> Uno per riga</label>
    <button class="btn primary" type="submit" id="launch" title="⌘ Invio">Nuovo terminale</button>
  </form>
  <div class="warn" id="warn"></div>
</header>
<div class="form-error" id="form-error" role="alert" hidden></div>
<nav class="tabs" id="tabs" role="tablist" aria-label="Terminali" hidden></nav>
<main class="work" id="work"></main>

<template id="empty-tpl">
  <div class="empty">
    <h1>Ogni terminale è una VM</h1>
    <p>Scegli un repository e premi <b>Nuovo terminale</b>: si accende una VM Debian solo per te, con il repo dentro e Claude Code già aperto con pieni permessi. Il tuo Mac resta intatto.</p>
    <ul>
      <li><b>Scrivi a Claude</b> direttamente nel terminale, come sempre. Con <b>Shell</b> apri un terminale nella stessa VM.</li>
      <li><b>Salva nel repo</b> porta il lavoro nel branch <code>agent/…</code> del tuo repository, senza chiudere niente.</li>
      <li><b>Chiudi VM</b> salva e distrugge la macchina. Con <b>Uno per riga</b> apri più agenti insieme, uno per ogni compito.</li>
    </ul>
  </div>
</template>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script>
"use strict";
const TERMINAL = new Set(["done", "no_changes", "failed", "stopped"]);
const BOOTING = new Set(["queued", "preparing", "booting"]);
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid);
  return e;
}
const repoName = p => p.split("/").filter(Boolean).pop() || p;
const shortPath = p => p.replace(/^\/Users\/[^/]+/, "~");

let tasks = [];
let selected = null;
let status = { running: 0, concurrency: 1, golden: true, token: true };
const views = new Map();   // id -> { root, terms: {claude, shell}, session, ... }

// ---------- stato sintetico di un terminale ----------
function phase(t) {
  const s = t.status.state;
  if (s === "queued") return ["s-boot", "In coda, aspetta una VM libera"];
  if (BOOTING.has(s)) return ["s-boot", "Avvio della VM"];
  if (s === "running") {
    if (!t.interactive) return ["s-work", "Al lavoro"];
    if (t.activity === "working") return ["s-work", "Claude sta lavorando"];
    if (t.activity === "waiting") return ["s-wait", "Claude ti aspetta"];
    return ["s-none", "Pronto"];
  }
  if (s === "collecting") return ["s-boot", "Salvataggio e spegnimento"];
  if (s === "done") return ["s-done", `Chiuso, ${t.status.commits} commit nel branch`];
  if (s === "no_changes") return ["s-done", "Chiuso, nessuna modifica"];
  if (s === "stopped") return ["s-stopped", "Fermato"];
  return ["s-failed", "Non riuscito"];
}
const titleOf = t => t.prompt ? t.prompt.split("\n")[0] : repoName(t.repo);

// ---------- barra superiore ----------
async function loadStatus() {
  try { status = await (await fetch("/api/status")).json(); } catch { return; }
  const live = tasks.filter(t => !TERMINAL.has(t.status.state)).length;
  $("#meter-bar").style.width = `${Math.min(100, (status.running / status.concurrency) * 100)}%`;
  const queued = tasks.filter(t => t.status.state === "queued").length;
  $("#meter-text").textContent = `${status.running}/${status.concurrency} VM` + (queued ? `, ${queued} in coda` : "");
  const warn = $("#warn");
  warn.replaceChildren();
  if (!status.golden) warn.append(h("button", { class: "pill-warn", type: "button", onclick: () => setup("golden") }, "Manca l'immagine VM"));
  if (!status.token) warn.append(h("button", { class: "pill-warn", type: "button", onclick: () => setup("token") }, "Manca il token Claude"));
  updateLaunch();
  return live;
}

function setup(what) {
  selected = null;
  renderTabs();
  const body = what === "golden"
    ? [h("h1", {}, "Crea l'immagine della VM"), h("p", {}, "Una volta sola, circa 2 minuti, dalla cartella del progetto:"), cmdRow("scripts/build-golden.sh")]
    : [h("h1", {}, "Collega il tuo account Claude"), h("p", {}, "Genera un token e salvalo nel Portachiavi (il secondo comando chiede di incollarlo):"), cmdRow("claude setup-token"), cmdRow("security add-generic-password -U -s agentvm -a agentvm -w")];
  showOnly(h("div", { class: "empty" }, ...body));
}

// ---------- lanciatore ----------
const RECENT_KEY = "agentvm.recentRepos";
const repoEl = $("#repo"), promptEl = $("#prompt");
function recentRepos() {
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch {}
  return [...new Set([...saved, ...tasks.map(t => shortPath(t.repo))])].slice(0, 8);
}
function rememberRepo(p) {
  try { localStorage.setItem(RECENT_KEY, JSON.stringify([p, ...recentRepos().filter(x => x !== p)].slice(0, 8))); } catch {}
}
function showRecent(show) {
  const box = $("#recent");
  const q = repoEl.value.trim().toLowerCase();
  const list = recentRepos().filter(p => !q || p.toLowerCase().includes(q) && p.toLowerCase() !== q);
  if (!show || !list.length) { box.hidden = true; return; }
  box.replaceChildren(...list.map(p => h("button", { type: "button", onmousedown: e => { e.preventDefault(); repoEl.value = p; box.hidden = true; updateLaunch(); promptEl.focus(); } },
    repoName(p), h("small", {}, p))));
  box.hidden = false;
}
repoEl.addEventListener("focus", () => showRecent(true));
repoEl.addEventListener("input", () => { showRecent(true); updateLaunch(); });
repoEl.addEventListener("blur", () => setTimeout(() => showRecent(false), 100));

function prompts() {
  const text = promptEl.value.trim();
  if (!$("#batch").checked) return [text];
  const lines = text.split("\n").map(l => l.replace(/^\s*[-*•\d.)]+\s+/, "").trim()).filter(Boolean);
  return lines.length ? lines : [""];
}
function updateLaunch() {
  const n = prompts().length;
  $("#launch").textContent = n > 1 ? `Apri ${n} terminali` : "Nuovo terminale";
  $("#launch").disabled = !status.golden || !status.token || !repoEl.value.trim();
}
function autosize() { promptEl.style.height = "32px"; const want = promptEl.scrollHeight + 2; promptEl.style.height = Math.min(want, 160) + "px"; promptEl.classList.toggle("tall", want > 160); }
promptEl.addEventListener("input", () => { autosize(); updateLaunch(); });
$("#batch").addEventListener("change", updateLaunch);
$("#launcher").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("#launcher").requestSubmit(); }
});
$("#launcher").addEventListener("submit", async e => {
  e.preventDefault();
  const repo_path = repoEl.value.trim();
  const err = $("#form-error");
  err.hidden = true;
  $("#launch").disabled = true;
  const ids = [];
  for (const prompt of prompts()) {
    const res = await fetch("/api/tasks", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ repo_path, prompt, interactive: true }) });
    const data = await res.json().catch(() => ({ error: "Risposta non valida dal server" }));
    if (!res.ok) { err.textContent = data.error; err.hidden = false; break; }
    ids.push(data.id);
  }
  if (ids.length) {
    rememberRepo(repo_path);
    promptEl.value = ""; autosize();
    await loadTasks();
    select(ids[0]);
  }
  updateLaunch();
});

// ---------- schede ----------
async function loadTasks() {
  try { tasks = await (await fetch("/api/tasks")).json(); } catch { return; }
  tasks.sort((a, b) => (TERMINAL.has(a.status.state) - TERMINAL.has(b.status.state)) || a.created_at - b.created_at);
  renderTabs();
  for (const t of tasks) views.get(t.id)?.update(t);
  const waiting = tasks.filter(t => t.status.state === "running" && t.activity === "waiting" && t.id !== selected).length;
  document.title = waiting ? `(${waiting}) agentvm` : "agentvm";
}

function renderTabs() {
  const nav = $("#tabs");
  nav.hidden = !tasks.length;
  nav.replaceChildren(...tasks.map(t => {
    const [cls, label] = phase(t);
    return h("button", { class: `tab ${cls}${TERMINAL.has(t.status.state) ? " ended" : ""}`, role: "tab", type: "button",
      "aria-selected": String(t.id === selected), title: `${titleOf(t)}\n${repoName(t.repo)} · ${label}`, onclick: () => select(t.id) },
      h("span", { class: "dot" }), h("span", { class: "name" }, titleOf(t)));
  }));
}

function showOnly(node) {
  for (const v of views.values()) v.root.hidden = true;
  const work = $("#work");
  for (const child of [...work.children]) if (!child.dataset.view) child.remove();
  if (node) work.append(node);
}

function select(id) {
  selected = id;
  history.replaceState(null, "", "#" + id);
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  let view = views.get(id);
  if (!view) { view = new TaskView(t); views.set(id, view); $("#work").append(view.root); }
  showOnly(null);
  view.root.hidden = false;
  view.update(t);
  view.focus();
  renderTabs();
}

// ---------- vista di un terminale ----------
class TaskView {
  constructor(t) {
    this.id = t.id;
    this.session = "claude";
    this.terms = {};
    this.statusEl = h("span", { class: "status" });
    this.savedEl = h("span", { class: "saved" });
    this.segBtns = ["claude", "shell"].map(s => h("button", { type: "button", "aria-pressed": String(s === "claude"), onclick: () => this.show(s) }, s === "claude" ? "Claude" : "Shell"));
    this.saveBtn = h("button", { class: "btn", type: "button", onclick: () => this.save() }, "Salva nel repo");
    this.closeBtn = h("button", { class: "btn", type: "button", onclick: () => this.close() }, "Chiudi VM");
    this.stopBtn = h("button", { class: "btn danger", type: "button", title: "Spegne subito la VM senza salvare", onclick: () => this.stop() }, "Forza arresto");
    this.toolbar = h("div", { class: "toolbar" }, h("div", { class: "seg" }, this.segBtns), this.statusEl, h("span", { class: "spacer" }), this.savedEl, this.saveBtn, this.closeBtn, this.stopBtn);
    this.overlay = h("div", { class: "overlay" });
    this.area = h("div", { class: "term-area" }, this.overlay);
    this.result = h("div", { class: "result" });
    this.result.hidden = true;
    this.root = h("section", { class: "work", "data-view": t.id, style: "flex:1;min-height:0" }, this.toolbar, this.area, this.result);
    new ResizeObserver(() => this.fit()).observe(this.area);
  }

  update(t) {
    this.task = t;
    const [cls, label] = phase(t);
    this.statusEl.className = `status ${cls}`;
    this.statusEl.replaceChildren(h("span", { class: "dot" }), h("b", {}, label), h("span", {}, ` ${repoName(t.repo)}`));
    const s = t.status.state;
    const live = s === "running";
    for (const b of [this.saveBtn, this.closeBtn]) b.hidden = !t.interactive || TERMINAL.has(s);
    this.saveBtn.disabled = this.closeBtn.disabled = !live;
    this.stopBtn.hidden = TERMINAL.has(s);
    for (const b of this.segBtns) b.hidden = !t.interactive || TERMINAL.has(s);
    if (TERMINAL.has(s)) return this.ended(t);
    if (!t.interactive) { this.overlayText("Agente senza terminale", "È stato avviato dall'API in modalità automatica."); return; }
    if (!live) { this.overlayText(s === "queued" ? "In coda" : "Avvio della VM", s === "queued" ? "Tutte le VM disponibili sono occupate: parte appena se ne libera una." : "Pochi secondi: Debian si accende e Claude si apre da solo."); return; }
    this.overlay.hidden = true;
    this.ensureTerm(this.session);
  }

  overlayText(title, text) {
    this.overlay.hidden = false;
    this.overlay.replaceChildren(h("div", {}, h("b", {}, title), text));
  }

  show(session) {
    this.session = session;
    for (const b of this.segBtns) b.setAttribute("aria-pressed", String(b.textContent.toLowerCase() === session));
    for (const [name, term] of Object.entries(this.terms)) term.el.hidden = name !== session;
    if (this.task?.status.state === "running") this.ensureTerm(session);
    this.focus();
  }

  ensureTerm(session) {
    let term = this.terms[session];
    if (!term) {
      term = this.terms[session] = new VmTerminal(this.id, session);
      this.area.append(term.el);
      term.el.hidden = session !== this.session;
    }
    if (!term.ws) term.connect();
    if (session === this.session) requestAnimationFrame(() => { term.fit(); term.xterm.focus(); });
  }

  fit() { this.terms[this.session]?.fit(); }
  focus() { this.terms[this.session]?.xterm.focus(); }

  async save() {
    this.saveBtn.disabled = true;
    this.savedEl.textContent = "Salvataggio…";
    const res = await fetch(`/api/tasks/${this.id}/save`, { method: "POST" });
    const data = await res.json().catch(() => ({}));
    this.savedEl.textContent = res.ok
      ? (data.commits ? `Salvato: ${data.commits} commit in agent/${this.id}` : "Niente da salvare per ora")
      : (data.error || "Salvataggio non riuscito");
    this.saveBtn.disabled = false;
    this.focus();
  }
  async close() {
    this.closeBtn.disabled = this.saveBtn.disabled = true;
    this.closeBtn.textContent = "Chiusura…";
    await fetch(`/api/tasks/${this.id}/close`, { method: "POST" });
    loadTasks();
  }
  async stop() {
    this.stopBtn.disabled = true;
    await fetch(`/api/tasks/${this.id}/stop`, { method: "POST" });
    loadTasks();
  }

  ended(t) {
    for (const term of Object.values(this.terms)) term.dispose();
    this.terms = {};
    this.area.hidden = true;
    this.savedEl.textContent = "";
    if (this.resultFor === t.status.state) return;
    this.resultFor = t.status.state;
    this.result.hidden = false;
    this.result.replaceChildren(outcome(t));
    if (t.status.state === "done") loadDiff(t, this.result);
  }
}

// ---------- terminale xterm collegato alla VM ----------
const THEME = {
  background: "#0b0e11", foreground: "#e3e8ee", cursor: "#e3e8ee", selectionBackground: "#2c4a70",
  black: "#1b2128", red: "#ec6b61", green: "#4cc28a", yellow: "#e2a93b", blue: "#5c9cf0", magenta: "#b48ce0", cyan: "#4cc0d0", white: "#d7dde3",
  brightBlack: "#5f6b77", brightRed: "#f2877e", brightGreen: "#6bd6a2", brightYellow: "#efc066", brightBlue: "#82b4f5", brightMagenta: "#c9a8ec", brightCyan: "#71d2df", brightWhite: "#ffffff",
};
class VmTerminal {
  constructor(id, session) {
    this.id = id; this.session = session;
    this.el = h("div", { class: "term" });
    this.xterm = new Terminal({
      fontFamily: '"SF Mono", ui-monospace, Menlo, monospace', fontSize: 13, lineHeight: 1.15, cursorBlink: true,
      macOptionIsMeta: true, macOptionClickForcesSelection: true, allowProposedApi: false, scrollback: 5000, theme: THEME,
    });
    this.fitter = new FitAddon.FitAddon();
    this.xterm.loadAddon(this.fitter);
    this.xterm.open(this.el);
    const enc = new TextEncoder();
    this.xterm.onData(d => { if (this.ws?.readyState === 1) this.ws.send(enc.encode(d)); });
    this.xterm.onResize(({ cols, rows }) => { if (this.ws?.readyState === 1) this.ws.send(JSON.stringify({ cols, rows })); });
  }
  fit() { if (!this.el.hidden && this.el.offsetWidth) try { this.fitter.fit(); } catch {} }
  connect() {
    this.fit();
    const { cols, rows } = this.xterm;
    const ws = new WebSocket(`ws://${location.host}/api/tasks/${this.id}/pty?session=${this.session}&cols=${cols}&rows=${rows}`);
    ws.binaryType = "arraybuffer";
    ws.onmessage = e => this.xterm.write(new Uint8Array(e.data));
    ws.onclose = () => {
      if (this.ws !== ws || this.disposed) return;
      this.ws = null;
      const t = tasks.find(t => t.id === this.id);
      if (t && t.status.state === "running") {
        if (this.session === "claude") this.xterm.write("\r\n\x1b[2m[sessione chiusa: premi Invio o attendi per riaprire Claude]\x1b[0m\r\n");
        setTimeout(() => { if (!this.ws && !this.disposed) this.connect(); }, this.session === "claude" ? 1500 : 800);
      }
    };
    this.ws = ws;
  }
  dispose() { this.disposed = true; this.ws?.close(); this.xterm.dispose(); this.el.remove(); }
}

// ---------- esito e modifiche ----------
function cmdRow(text) {
  const btn = h("button", { class: "copy", type: "button" }, "Copia");
  btn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copiato"; } catch { btn.textContent = "Selezionalo"; }
    setTimeout(() => (btn.textContent = "Copia"), 1500);
  });
  return h("div", { class: "cmd" }, h("code", {}, text), btn);
}
function explain(reason = "") {
  if (reason === "timeout") return ["Tempo massimo superato", "L'agente è stato fermato dopo il limite impostato."];
  if (reason === "guest_no_result") return ["La VM si è spenta senza risultato", "Controlla console.log nella cartella del job."];
  if (reason.startsWith("claude_exit")) return ["Claude si è fermato con un errore", ""];
  if (reason.startsWith("vm_error")) return ["La VM non è partita", "Virtualization.framework ha riportato un errore."];
  if (reason.startsWith("fetch_failed")) return ["Impossibile importare il branch", "Il lavoro è finito ma git fetch non è riuscito."];
  return ["Non riuscito", ""];
}
function outcome(t) {
  const s = t.status.state;
  const [cls] = phase(t);
  const repo = shortPath(t.repo).replace(/ /g, "\\ ");
  const box = h("div", { class: `outcome ${cls}`, style: `--c: var(--c-${s === "failed" ? "failed" : s === "stopped" ? "stopped" : "done"})` });
  if (s === "done") box.append(h("div", { class: "title" }, `Branch ${t.branch} con ${t.status.commits} commit`),
    h("div", { class: "why" }, "È nel tuo repository. Per provarlo o unirlo:"), cmdRow(`git -C ${repo} switch ${t.branch}`), cmdRow(`git -C ${repo} merge ${t.branch}`));
  else if (s === "no_changes") box.append(h("div", { class: "title" }, "Chiuso senza modifiche ai file"), h("div", { class: "why" }, "Nessun branch creato."));
  else if (s === "stopped") box.append(h("div", { class: "title" }, "Fermato"), h("div", { class: "why" }, "La VM è stata spenta senza salvare. Quello già salvato resta nel branch."));
  else { const [title, why] = explain(t.status.reason); box.append(h("div", { class: "title" }, title), why && h("div", { class: "why" }, why), h("div", { class: "code" }, t.status.reason ?? "")); }
  return box;
}
async function loadDiff(t, container) {
  const res = await fetch(`/api/tasks/${t.id}/diff`);
  if (!res.ok) return;
  const files = parseDiff(await res.text());
  if (!files.length) return;
  const add = files.reduce((n, f) => n + f.add, 0), del = files.reduce((n, f) => n + f.del, 0);
  container.append(h("div", { class: "diff-summary" }, `${files.length} file modificati, `, h("span", { class: "plus" }, `+${add}`), " ", h("span", { class: "minus" }, `−${del}`)),
    ...files.map((f, i) => h("details", { class: "diff-file", open: files.length <= 4 || i === 0 },
      h("summary", {}, h("span", { class: "path", title: f.path }, f.path), h("span", { class: "plus" }, `+${f.add}`), h("span", { class: "minus" }, `−${f.del}`)),
      h("div", { class: "diff-body" }, f.lines.map(l => h("div", { class: l.startsWith("@@") ? "h" : l.startsWith("+") ? "a" : l.startsWith("-") ? "d" : "" }, l))))));
}
function parseDiff(text) {
  const files = [];
  let cur = null;
  for (const line of text.split("\n")) {
    if (line.startsWith("diff --git")) { const m = line.match(/ b\/(.+)$/); cur = { path: m ? m[1] : line, add: 0, del: 0, lines: [] }; files.push(cur); }
    else if (!cur || /^(index |--- |\+\+\+ |new file mode|deleted file mode|similarity |rename )/.test(line)) continue;
    else { if (line.startsWith("+")) cur.add++; else if (line.startsWith("-")) cur.del++; cur.lines.push(line); }
  }
  return files;
}

// ---------- avvio ----------
(async () => {
  repoEl.value = recentRepos()[0] ?? "";
  await loadTasks();
  await loadStatus();
  if (!repoEl.value) repoEl.value = recentRepos()[0] ?? "";
  const fromHash = location.hash.slice(1);
  const first = tasks.find(t => t.id === fromHash) ?? tasks.find(t => !TERMINAL.has(t.status.state));
  if (first) select(first.id); else showOnly($("#empty-tpl").content.firstElementChild.cloneNode(true));
  updateLaunch();
  setInterval(() => { loadTasks(); loadStatus(); }, 1500);
})();
</script>
