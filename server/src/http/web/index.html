<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentvm</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="#/wall" aria-label="agentvm home">
    <img src="/logo.svg" alt="" width="22" height="22"><span>agentvm</span>
  </a>
  <nav class="nav" aria-label="Sections">
    <a href="#/wall" data-nav="wall">Machines</a>
    <a href="#/snapshots" data-nav="snapshots">Snapshots</a>
    <a href="#/settings" data-nav="settings">Settings</a>
  </nav>
  <div class="host" id="host" aria-label="This Mac"></div>
  <button class="btn primary" id="new-vm" type="button" title="New VM (⌘K)">New VM</button>
</header>

<dialog class="launch-dialog" id="launch-dialog" aria-label="Launch a VM">
<form class="launcher" id="launcher" autocomplete="off" method="dialog">
  <div class="launch-title"><img src="/logo.svg" alt="" width="20" height="20"><b>Launch a sealed VM</b><span>Claude Code opens inside with root and every permission.</span></div>
  <div class="field repo">
    <label for="repo">Repository</label>
    <input id="repo" name="repo_path" placeholder="~/code/my-app" spellcheck="false" required>
    <div class="suggest" id="suggest" hidden></div>
  </div>
  <div class="field model">
    <label for="model">Model</label>
    <select id="model" name="model"></select>
    <input id="model-custom" placeholder="claude-opus-5-5" spellcheck="false" hidden>
  </div>
  <div class="field version">
    <label for="claude-version">Claude Code</label>
    <select id="claude-version" name="claude_version"><option value="">Image version</option></select>
  </div>
  <div class="field res-cpu">
    <label for="vm-cpus">vCPUs</label>
    <select id="vm-cpus" name="cpus"></select>
  </div>
  <div class="field res-mem">
    <label for="vm-mem">Memory</label>
    <select id="vm-mem" name="memory_mb"></select>
  </div>
  <p class="res-hint" id="res-hint"></p>
  <div class="field task">
    <label for="prompt">First task <span class="opt">optional</span></label>
    <textarea id="prompt" name="prompt" rows="3" placeholder="Fix the failing test in parser.rs and commit"></textarea>
  </div>
  <label class="check" title="Every line of the task opens its own VM"><input type="checkbox" id="batch"> One VM per line</label>
  <button class="btn primary" id="launch" type="submit">Launch VM <kbd>⌘↵</kbd></button>
  <p class="form-error" id="form-error" role="alert" hidden></p>
</form>
</dialog>

<main id="view"></main>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-webgl.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
